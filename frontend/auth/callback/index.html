<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang đăng nhập…</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
</head>
<body>
  <!--
    Trang trung chuyển OAuth (kiến trúc 2 origin — MIGRATION_NOTES §OAuth):
    backend đính JWT vào URL fragment sau khi allauth xong, trang này lưu token
    rồi về /dashboard. Fragment KHÔNG bao giờ đi lên server nên token không lọt log.
  -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      var access = params.get('access');
      var refresh = params.get('refresh');
      if (!access) {
        window.location.replace('/login?error=google_failed');
        return;
      }
      try {
        localStorage.setItem('pe_access', access);
        if (refresh) localStorage.setItem('pe_refresh', refresh);
      } catch (e) { /* private mode */ }
      window.location.replace('/dashboard');
    })();
  </script>
</body>
</html>
