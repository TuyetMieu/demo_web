<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Mọi template gốc đều có meta này; course_detail.js/course_db_design.js đọc
       .content KHÔNG guard nên thẻ phải tồn tại (rỗng — auth giờ là JWT). -->
  <meta name="csrf-token" content="">
  <title>Quản trị | Programming EDU</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
  <!-- Origin backend cho pe-bridge.js — PHẢI nạp trước mọi script khác -->
  <script src="/static/js/pe-config.js"></script>
  <link rel="stylesheet" href="/static/css/pages/admin.inline.css">
</head>
<body>
    <header>
      <h1>🛠️ Trang quản trị</h1>
      <a href="/dashboard">← Về dashboard</a>
    </header>

    <div class="wrap">
      <!-- KHÓA HỌC -->
      <section>
        <h2>Khóa học</h2>
        <table>
          <thead><tr><th>Id</th><th>Tiêu đề</th><th>Bài</th><th></th></tr></thead>
          <tbody id="courseRows"></tbody>
        </table>

        <div class="form-box">
          <h3 id="courseFormTitle">Thêm khóa học</h3>
          <input id="cId" placeholder="id (vd: python)">
          <input id="cTitle" placeholder="Tiêu đề">
          <input id="cSubtitle" placeholder="Phụ đề">
          <textarea id="cDescription" placeholder="Mô tả"></textarea>
          <div class="row">
            <input id="cLevel" placeholder="Cấp độ">
            <input id="cDuration" placeholder="Thời lượng">
          </div>
          <div class="row">
            <input id="cTag" placeholder="Tag">
            <input id="cImage" placeholder="Đường dẫn ảnh">
          </div>
          <div class="row">
            <input id="cColor" placeholder="color">
            <input id="cAccentColor" placeholder="accent_color">
          </div>
          <button class="btn-primary" onclick="saveCourse()">Lưu</button>
          <button class="btn-ghost" onclick="resetCourseForm()">Hủy</button>
        </div>
      </section>

      <!-- BÀI GIẢNG -->
      <section>
        <h2 id="lessonTitle">Bài giảng</h2>
        <p class="hint" id="lessonHint">Chọn một khóa học để xem bài giảng.</p>
        <table>
          <thead><tr><th>#</th><th>Module</th><th>Tiêu đề</th><th></th></tr></thead>
          <tbody id="lessonRows"></tbody>
        </table>

        <div class="form-box" id="lessonFormBox" style="display:none">
          <h3 id="lessonFormTitle">Thêm bài giảng</h3>
          <input id="lModule" placeholder="Module">
          <input id="lLessonTitle" placeholder="Tiêu đề bài giảng">
          <textarea id="lContent" placeholder="Nội dung"></textarea>
          <input id="lSort" type="number" placeholder="Thứ tự" value="0">
          <button class="btn-primary" onclick="saveLesson()">Lưu</button>
          <button class="btn-ghost" onclick="resetLessonForm()">Hủy</button>
        </div>
      </section>
    </div>

    <div id="toast"></div>

  <script src="/static/js/pe-bridge.js"></script>
  <script src="/static/js/pages/admin.inline.js"></script>
</body>
</html>
