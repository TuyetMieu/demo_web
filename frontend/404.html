<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không tìm thấy trang — Programming EDU</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0B1120; color: #E2E8F0; font-family: Inter, system-ui, sans-serif; text-align: center; }
    .box { max-width: 32rem; padding: 2rem; }
    h1 { font-size: 4rem; margin: 0 0 .5rem; }
    p { color: #94A3B8; line-height: 1.6; }
    a { color: #38BDF8; }
  </style>
</head>
<body>
  <!--
    Trang 404 dùng chung. Ngoài việc báo lỗi, nó thay luôn route động
    /lesson/<courseId> của bản Next cũ (main.py _LESSON_URLS):
      cpp                → /interface
      khóa không có trang bài học riêng → /courses/<id>
      khóa không tồn tại → /dashboard
    Chỉ chạy trên host có phục vụ 404.html cho đường dẫn lạ (nginx try_files,
    Netlify, `npx serve`). `python -m http.server` trả 404 trống — khi đó
    /lesson/<id lạ> chỉ đơn giản không mở được, không ảnh hưởng 7 khóa có sẵn.
  -->
  <script>
    (function () {
      var m = /^\/lesson\/([^/?#]+)/.exec(location.pathname);
      if (!m) return;
      var id = decodeURIComponent(m[1]);
      // 7 khóa có trang bài học tĩnh — tới đây nghĩa là id không thuộc nhóm đó
      if (id === 'cpp') { location.replace('/interface'); return; }
      location.replace('/courses/' + encodeURIComponent(id));
    })();
  </script>

  <div class="box">
    <h1>404</h1>
    <p>Không tìm thấy trang bạn yêu cầu.</p>
    <p><a href="/dashboard">← Về dashboard</a> · <a href="/">Trang chủ</a></p>
  </div>
</body>
</html>
