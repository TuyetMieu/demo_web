# CI cho bản migrate (Giai đoạn 6) — thứ project gốc chưa từng có.
# pytest backend + kiểm tra tính toàn vẹn frontend tĩnh trên mỗi push/PR.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Django) — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django
      - name: Run pytest
        working-directory: backend
        env:
          # Bộ test chạy trên DB thật (rollback cuối test — xem backend/conftest.py).
          # Khai báo secret DATABASE_URL trong repo settings; thiếu secret thì job fail sớm.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ci-only-secret-key
        run: python -m pytest -q

  frontend:
    # Frontend là HTML/CSS/JS thuần — không build, không bundler, không cài gì.
    # Thay lint+tsc+build cũ bằng 2 test Node thuần chạy trực tiếp trên source.
    name: Frontend (tĩnh) — kiểm tra toàn vẹn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Đường dẫn tài nguyên + route
        working-directory: frontend
        run: node e2e/unit/static-assets.test.mjs
      - name: Chống hồi quy XSS forum
        working-directory: frontend
        run: node e2e/unit/forum-xss.test.mjs
